name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Dual-use policy (npm): 9router-plinian ships red-team payload collections +
# a postinstall runtime warmer. Since the 2026-07-28 publish-time scanning,
# a package declaring `contentPolicy: { class: "dual-use" }` may ONLY be
# promoted to live via a 2FA-gated staged publish. Direct OIDC `npm publish`
# is rejected; we therefore stage here and a human approves with 2FA on HP.
#
# Trusted publishing (OIDC) still handles the STAGING step — no npm token
# stored in the repo. The connection (Azhar457/9router + publish.yml +
# environment "npm") is configured once on npmjs.com.
concurrency:
  group: npm-publish-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # OIDC token for npm stage publish

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm # must match the "Environment name" on npmjs.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # package-lock.json is intentionally gitignored in this repo (.gitignore:63),
      # so npm ci is not an option here.
      - name: Install dependencies
        run: npm install

      # cli/scripts/buildMitm.js needs esbuild (cli devDependency)
      - name: Install CLI dependencies
        run: npm install --prefix cli

      # Trusted publishing needs npm >= 11.5.1 for the OIDC flow;
      # `npm stage publish` needs npm >= 11.3.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Stage the publish (await 2FA approval)
        run: |
          set +e
          out=$(npm run cli:publish 2>&1)
          code=$?
          echo "$out"
          if [ "$code" -ne 0 ] && grep -q "Cannot stage previously published version" <<< "$out"; then
            echo "::notice::Version already staged — duplicate run, nothing to do. Approve the existing stage (npmjs.com → package → Staged queue)."
            exit 0
          fi
          exit "$code"
        env:
          NODE_AUTH_TOKEN: "" # empty on purpose — OIDC authenticates the stage

      - name: Print next-step reminder
        if: always()
        run: |
          echo "::notice::9router-plinian staged via OIDC. A human with 2FA must run:"
          echo "::notice::    npm stage list 9router-plinian"
          echo "::notice::    npm stage approve <stage-id>"
          echo "::notice::  (npmjs.com → package → Staged queue → Approve also works)"
